name: Dashboard Update

# Personal fork version: MERGES upstream into this repo (keeping the fork's own
# changes), deploys with Wrangler, then pushes. The upstream original replaced
# the whole tree with upstream (git read-tree --reset), which would wipe local
# changes. On a merge conflict nothing is deployed or pushed.
#
# Repository secrets:
#   MAILFLARE_UPDATE_TOKEN  GitHub token with contents + workflows write on this repo
#   CLOUDFLARE_API_TOKEN    Cloudflare token that can deploy the Worker
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailflare-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_SOURCE_REPOSITORY: ${{ vars.UPDATE_SOURCE_REPOSITORY || 'hieunc229/mailflare' }}

    steps:
      - name: Check secrets
        env:
          UPDATE_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}
          CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "${UPDATE_TOKEN}" ] || { echo "::error::Add MAILFLARE_UPDATE_TOKEN as a repository Actions secret."; missing=1; }
          [ -n "${CF_API}" ] || { echo "::error::Add CLOUDFLARE_API_TOKEN as a repository Actions secret."; missing=1; }
          [ -n "${CF_ACCOUNT}" ] || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a repository Actions secret."; missing=1; }
          exit $missing

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN }}

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "mailflare-update"
          git config user.email "mailflare-update@users.noreply.github.com"

          upstream_url="https://github.com/${UPDATE_SOURCE_REPOSITORY}.git"
          git remote add upstream "${upstream_url}" 2>/dev/null || git remote set-url upstream "${upstream_url}"
          git fetch --no-tags upstream

          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          upstream_ref="upstream/${upstream_branch:-main}"

          if git merge-base --is-ancestor "${upstream_ref}" HEAD; then
            echo "Repository is already up to date with ${upstream_ref}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merging ${upstream_ref}:"
          git log --oneline "HEAD..${upstream_ref}" | head -50
          if ! git merge --no-edit "${upstream_ref}"; then
            echo "::error::Merge conflict with ${upstream_ref}. Nothing was deployed. Resolve locally with ./update."
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build and deploy
        if: steps.merge.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Push merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
